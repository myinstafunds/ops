[project]
name = "ops-control-center-backend"
version = "0.1.0"
description = "Ops Control Center API - Releases 0 and 1 (security foundation + control plane)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "PyJWT==2.10.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "DTZ",  # naive datetimes
    "T20",  # no print() in library code
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the documented pattern
    "RUF001", # ambiguous unicode in strings: masked PII samples are intentional
    "RUF002",
    "RUF003",
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["T20", "B008"]
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]
exclude = ["^migrations/versions/"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "uvicorn.*",
    "structlog.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: tests that spin up threads or sleep",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
