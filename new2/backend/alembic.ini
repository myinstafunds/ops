# Alembic configuration for the Ops Control Center API.
#
# The database URL is intentionally blank here. `migrations/env.py` reads it
# from the application settings (DATABASE_URL / .env) so credentials never live
# in version control (PRD 41).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# sqlalchemy.url is set at runtime by migrations/env.py. The placeholder is
# required because Alembic validates the key exists.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Customise the revision file naming: NN_<slug>
revision_environment = false

[post_write_hooks]

# Guard rails -------------------------------------------------------
# Autogenerate must never silently drop a table. These run against the
# generated SQL in --sql mode; in normal use they are documentation of intent.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
